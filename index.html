<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d13">
<title>Carneiro Run · Maratona</title>
<meta name="description" content="Vídeo na íntegra da maratona Carneiro Run.">
<meta property="og:title" content="Carneiro Run · Maratona">
<meta property="og:description" content="Assista ao vídeo na íntegra.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://brenomadeira88.github.io/carneiro-run/">
<meta property="og:image" content="https://brenomadeira88.github.io/carneiro-run/thumb.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://brenomadeira88.github.io/carneiro-run/thumb.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #070d13;
    --surface: #0e1822;
    --line: #1b2a38;
    --fg: #eef4f8;
    --muted: #8fa3b3;
    --accent: #00aeef;
    --ink: #04121c;
    --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background:
      radial-gradient(120% 50% at 50% -10%, rgba(0,174,239,.16), transparent 60%),
      var(--bg);
  }
  body.locked { overflow: hidden; }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding-block: 36px 32px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .logo { width: min(78%, 320px); margin: 0 auto; }
  .logo img { display: block; width: 100%; height: auto; mix-blend-mode: lighten; }

  .head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .eyebrow {
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    letter-spacing: .22em;
    font-size: 13px;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-style: italic;
    font-size: clamp(40px, 13vw, 60px);
    line-height: .95;
    text-transform: uppercase;
  }

  /* Capa vertical do vídeo */
  .poster {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: block;
    width: min(100%, 320px);
    margin: 0 auto;
    aspect-ratio: 9 / 16;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line);
    background-color: var(--surface);
    background-image:
      linear-gradient(180deg, rgba(7,13,19,.05) 40%, rgba(7,13,19,.85) 100%),
      url("https://drive.google.com/thumbnail?id=1ThdGfZ3WY53U97byx2wXh06xcu1AXNBZ&sz=w720"),
      linear-gradient(160deg, #0f2333, #070d13);
    background-size: cover;
    background-position: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .poster:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .play {
    position: absolute;
    top: 50%; left: 50%;
    width: 78px; height: 78px;
    margin: -39px 0 0 -39px;
    border-radius: 50%;
    background: var(--accent);
    display: grid; place-items: center;
    box-shadow: 0 0 0 10px rgba(0,174,239,.2);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .play svg { width: 30px; height: 30px; margin-left: 5px; fill: var(--ink); }
  .poster:hover .play, .poster:focus-visible .play { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(0,174,239,.25); }
  .poster-label {
    position: absolute;
    left: 18px; right: 18px; bottom: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .poster-label strong {
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  /* linha tracejada da marca */
  .track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg,
      var(--accent) 0 5%, transparent 5% 11%,
      var(--accent) 11% 17%, transparent 17% 23%,
      var(--accent) 23% 31%, transparent 31% 36%,
      var(--accent) 36% 100%);
  }

  .alt {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .alt a { color: var(--accent); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  /* Player em tela cheia, vertical */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .viewer[hidden] { display: none; }
  .viewer .frame {
    height: 100%;
    width: 100%;
    max-width: calc(100vh * 9 / 16);
    max-width: calc(100svh * 9 / 16);
    position: relative;
  }
  .viewer iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  .close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    z-index: 2;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 0;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 26px;
    line-height: 44px;
    cursor: pointer;
  }
  .close:focus-visible { outline: 2px solid var(--accent); }

  @media (prefers-reduced-motion: reduce) { .play { transition: none; } }
</style>
</head>
<body>

<main class="wrap">
  <div class="logo"><img src="logo.jpg" alt="Carneiro Run" width="1280" height="423"></div>

  <header class="head">
    <div class="eyebrow">Vídeo na íntegra</div>
    <h1>Maratona</h1>
  </header>

  <button class="poster" id="openBtn" type="button" aria-label="Assistir ao vídeo em tela cheia">
    <span class="play" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L7.5 3.64A1 1 0 0 0 6 4.5z"/></svg>
    </span>
    <span class="poster-label">
      <strong>Toque para assistir</strong>
      <span class="track"></span>
    </span>
  </button>

  <p class="alt">Não abriu? <a href="https://drive.google.com/file/d/1ThdGfZ3WY53U97byx2wXh06xcu1AXNBZ/view?usp=sharing" target="_blank" rel="noopener">Assistir no Google Drive</a></p>

  <footer>Filmagem e edição · Breno Madeira · @brenomadeira</footer>
</main>

<div class="viewer" id="viewer" hidden>
  <button class="close" id="closeBtn" type="button" aria-label="Fechar vídeo">×</button>
  <div class="frame">
    <iframe id="video" title="Carneiro Run · Maratona" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<script>
  const SRC = "https://drive.google.com/file/d/1ThdGfZ3WY53U97byx2wXh06xcu1AXNBZ/preview";
  const viewer = document.getElementById("viewer");
  const video = document.getElementById("video");

  function open() {
    video.src = SRC;
    viewer.hidden = false;
    document.body.classList.add("locked");
    if (location.hash !== "#video") history.pushState(null, "", "#video");
    try { if (viewer.requestFullscreen) viewer.requestFullscreen().catch(() => {}); } catch (e) {}
    document.getElementById("closeBtn").focus();
  }
  function close() {
    viewer.hidden = true;
    video.src = "about:blank";
    document.body.classList.remove("locked");
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    document.getElementById("openBtn").focus();
  }

  document.getElementById("openBtn").addEventListener("click", open);
  document.getElementById("closeBtn").addEventListener("click", () => {
    if (location.hash === "#video") history.back(); else close();
  });
  // botão "voltar" do celular fecha o vídeo em vez de sair da página
  window.addEventListener("popstate", () => { if (!viewer.hidden) close(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !viewer.hidden) {
      if (location.hash === "#video") history.back(); else close();
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && !viewer.hidden && location.hash === "#video") history.back();
  });
  if (location.hash === "#video") history.replaceState(null, "", location.pathname + location.search);
</script>
</body>
</html>
